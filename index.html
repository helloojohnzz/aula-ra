<!DOCTYPE html>
<html>
  <head>
    <title>Minha Primeira RA</title>
    <!-- Inclui o A-Frame (framework para 3D na web) -->
    <script src="https://aframe.io"></script>
    <!-- Inclui o AR.js (componente que traz a RA para o A-Frame) -->
    <script src="https://githack.com"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <!-- Inicializa a cena de RA usando a câmera do dispositivo -->
    <scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Define o marcador que a câmera deve rastrear (Padrão Hiro) -->
      <marker preset="hiro">
        <!-- Renderiza um cubo vermelho sobre o marcador -->
        <box position="0 0.5 0" material="color: red;" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></box>
      </marker>
      
      <!-- Adiciona a câmera virtual para processar a visão do usuário -->
      
    </scene>
  </body>
</html>
